
name: Build Firestrike APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract source
        run: |
          mkdir source
          tar -xzf firestrike_mod_menu_integrated.tar.gz -C source

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      - name: Build debug APK
        working-directory: source/com.eightsines.firestrike.opensource_2000_src.tar.gz/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: firestrike-debug-apk
          path: source/com.eightsines.firestrike.opensource_2000_src.tar.gz/android/build/outputs/apk/debug/*.apk
          
